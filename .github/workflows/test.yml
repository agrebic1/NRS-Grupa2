name: Test

on: [push, pull_request]

defaults:
  run:
    working-directory: Projekat # aplikativni kod je u poddirektoriju repozitorija

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Projekat/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run test:coverage
